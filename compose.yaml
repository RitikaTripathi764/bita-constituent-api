services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bita
      POSTGRES_PASSWORD: bita
      POSTGRES_DB: bita
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bita -d bita"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://bita:bita@db:5432/bita
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  test:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://bita:bita@db:5432/bita
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
